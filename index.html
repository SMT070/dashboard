<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Startup Dashboard</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1b18;--mu:#77746b;--bd:#e4e1d8;--ac:#2f5bea;--ac2:#e8edfd;--ok:#2a8a57;--wa:#c27a10;--er:#c93c3c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--card:#1e2026;--tx:#ecebe6;--mu:#9a98a0;--bd:#2f323a;--ac:#6f8dff;--ac2:#252c45;--ok:#4cc486;--wa:#e5a43a;--er:#ee6a6a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15161a;--card:#1e2026;--tx:#ecebe6;--mu:#9a98a0;--bd:#2f323a;--ac:#6f8dff;--ac2:#252c45;--ok:#4cc486;--wa:#e5a43a;--er:#ee6a6a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:18px;margin:0;flex:1}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.stat b{display:block;font-size:28px}.stat span{color:var(--mu);font-size:13px}
h2{font-size:15px;margin:0 0 10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
input[type=text]{flex:1;min-width:160px}textarea{width:100%;min-height:70px;resize:vertical}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.ghost{background:none;border:0;color:var(--mu);cursor:pointer;font:inherit;padding:2px 6px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.col h2{color:var(--mu);text-transform:uppercase;font-size:12px;letter-spacing:.05em}
.item{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.item .t{font-weight:600}.meta{color:var(--mu);font-size:12.5px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{padding:1px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);font-size:12px}
.high{color:var(--er)}.medium{color:var(--wa)}.low{color:var(--ok)}
.late{color:var(--er);font-weight:600}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.empty{color:var(--mu);font-size:13px;padding:6px 0}
p.body{white-space:pre-wrap;margin:6px 0 0}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
footer{text-align:center;color:var(--mu);font-size:12px;padding:20px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root:root:root{--bg:#04050d;--card:rgba(14,18,40,.72);--tx:#e8f0ff;--mu:#8190b8;--bd:rgba(80,140,255,.28);--ac:#00e5ff;--ac2:rgba(0,229,255,.12);--ok:#2bffa0;--wa:#ffb020;--er:#ff3d7f;--mg:#ff2bd6;color-scheme:dark}

.btn:hover{transform:translateY(-1px);box-shadow:0 0 30px rgba(255,43,214,.6)}
.ghost:hover{color:var(--ac)}

.bar i{background:linear-gradient(90deg,var(--ac),var(--mg));box-shadow:0 0 12px var(--ac)}
.pill{border:1px solid var(--ac);text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.row{border-bottom:1px solid var(--bd)}
.high,.medium,.low,.late{text-shadow:0 0 8px currentColor}
footer{letter-spacing:.08em;text-transform:uppercase;font-size:11px}
</style>
<style>
:root:root:root{--bg:#14171f;--card:rgba(32,37,50,.72);--hd:rgba(20,23,31,.8);--inp:rgba(14,17,24,.7);--tx:#e6e9f0;--mu:#8f98ab;--bd:rgba(140,160,210,.18);--ac:#7aa2f7;--ac2:rgba(122,162,247,.14);--mg:#b794f6;--ok:#6fcf97;--wa:#e5b567;--er:#eb7a8c;--glow:rgba(122,162,247,.3);--sh:rgba(0,0,0,.28);--onac:#12151c;--g1:rgba(122,162,247,.12);--g2:rgba(183,148,246,.1);color-scheme:dark}

.btn{border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--mg));color:var(--onac);letter-spacing:.06em;box-shadow:0 4px 14px var(--glow);transition:transform .2s,box-shadow .2s}

try{
if(up.length){const {error}=await sb.from('records').upsert(up.map(k=>cur[k].r),{onConflict:'user_id,id'});if(error)throw error;up.forEach(k=>{snap[k]=cur[k].j})}
if(dl.length){const {error}=await sb.from('records').delete().in('id',dl);if(error)throw error;dl.forEach(k=>{delete snap[k]})}
setSt('saved')}catch(e){ok=false;setSt('error')}
busy=false;if(again){again=false;return push()}return ok}
function apply(data){const n=EMPTY();snap={};
data.forEach(r=>{if(!n[r.kind])return;const o=Object.assign({},r.data,{id:Number(r.id)});n[r.kind].push(o);snap[String(o.id)]=js(o)});
for(const k in n)n[k].sort((a,b)=>b.id-a.id);S=n;render()}
async function boot(){hideGate();document.getElementById('out').style.display='';setSt('syncing');
const {data,error}=await sb.from('records').select('*');
if(error){setSt('error');return}
if(!data.length&&Object.keys(EMPTY()).some(k=>S[k].length)){snap={};if(await push()){try{localStorage.removeItem(KEY)}catch(e){}}return}
apply(data);setSt('saved');anim()}
async function refresh(){if(!sb||!user||busy||timer)return;
const {data,error}=await sb.from('records').select('*');if(error||busy||timer)return;
const ns={};data.forEach(r=>{ns[r.id]=js(Object.assign({},r.data,{id:Number(r.id)}))});
const f=m=>JSON.stringify(Object.keys(m).sort().map(k=>[k,m[k]]));
if(f(ns)!==f(snap))apply(data)}
function nice(e){const m=(e&&e.message||'').toLowerCase();
if(m.includes('invalid login'))return 'Wrong email or password. New here? Choose Create account.';
if(m.includes('already registered')||m.includes('already been registered'))return 'This email already has an account. Choose Sign in.';
if(m.includes('email not confirmed'))return 'Please confirm your email first. Check your inbox and spam folder.';
if(m.includes('rate limit')||m.includes('too many'))return 'Too many attempts. Please wait a few minutes and try again.';
if(m.includes('password')&&(m.includes('least')||m.includes('weak')||m.includes('short')))return 'Password is too short. Use at least 6 characters.';
if(m.includes('database error saving'))return 'Sign-up was blocked. Check the access code.';
if(m.includes('failed to fetch')||m.includes('network'))return 'Cannot reach the server. Check your internet connection.';
if(m.includes('invalid email')||m.includes('unable to validate'))return 'That email address does not look valid.';
return e&&e.message?e.message:'Something went wrong. Try again.'}
function readGv(){const f=document.getElementById('af');if(!f)return;const e=f.elements;if(e.code)gv.code=e.code.value;if(e.email)gv.email=e.email.value}
function msg(t,k){const e=document.getElementById('am');if(!e)return;e.textContent=t||'';e.className='meta '+(k||'')}
function togglePw(v){document.querySelectorAll('.pw').forEach(i=>{i.type=v?'text':'password'})}
function hideGate(){gm=null;document.getElementById('gate').innerHTML=''}
function showGate(mode,t,k){readGv();gm=mode;
const tabs=(mode==='in'||mode==='up')?`<div class="tabs"><button type="button" class="${mode==='in'?'on':''}" onclick="showGate('in')">Sign in</button><button type="button" class="${mode==='up'?'on':''}" onclick="showGate('up')">Create account</button></div>`:'';
const pw=(n,ph,au)=>`<input class="pw" type="password" name="${n}" placeholder="${ph}" required minlength="6" autocomplete="${au}" style="width:100%">`;
const code=`<input class="pw" type="password" name="code" inputmode="numeric" placeholder="Access code" required autocomplete="off" value="${esc(gv.code)}" style="width:100%">`;
const em=`<input type="email" name="email" placeholder="Email" required autocomplete="email" value="${esc(gv.email)}" style="width:100%">`;
const show='<label class="chk"><input type="checkbox" onchange="togglePw(this.checked)"> Show password and code</label>';
let body;
if(mode==='in')body=`${code}${em}${pw('pw','Password','current-password')}${show}<button class="btn" style="width:100%">Sign in</button><button type="button" class="ghost" onclick="showGate('forgot')">Forgot password?</button>`;
else if(mode==='up')body=`${code}${em}${pw('pw','Password (at least 6 characters)','new-password')}${pw('pw2','Repeat password','new-password')}${show}<button class="btn" style="width:100%">Create account</button>`;
else if(mode==='forgot')body=`${em}<button class="btn" style="width:100%">Send reset link</button><button type="button" class="ghost" onclick="showGate('in')">Back to sign in</button>`;
else body=`${pw('pw','New password (at least 6 characters)','new-password')}${pw('pw2','Repeat new password','new-password')}${show}<button class="btn" style="width:100%">Save new password</button>`;
const head={in:'Welcome back. Sign in to continue.',up:'Create your account. You need the access code.',forgot:'Enter your email to get a reset link.',newpw:'Choose a new password.'}[mode];
document.getElementById('gate').innerHTML=`<div class="gate"><div class="card" style="width:100%;max-width:390px"><h1 style="margin-bottom:4px">Startup Dashboard</h1><div class="meta" style="margin-bottom:14px">${head}</div>${tabs}<form id="af" onsubmit="event.preventDefault();doAuth()" style="flex-direction:column;margin:0">${body}</form><div id="am" class="meta" role="alert" style="margin-top:10px"></div></div></div>`;
if(t)msg(t,k)}
async function doAuth(){const f=document.getElementById('af');if(!f||!f.reportValidity())return;readGv();
const E=f.elements,b=f.querySelector('.btn'),mode=gm,email=E.email?E.email.value.trim():'',pw=E.pw?E.pw.value:'',code=E.code?E.code.value.trim():'';
if((mode==='up'||mode==='newpw')&&pw!==E.pw2.value){msg('The two passwords do not match.','bad');return}
b.disabled=true;msg('Please wait\u2026');
try{
if(mode==='forgot'){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;msg('If an account exists for that email, a reset link is on its way. Check your inbox and spam.','ok');return}
if(mode==='newpw'){const {error}=await sb.auth.updateUser({password:pw});if(error)throw error;recovering=false;user=pend;history.replaceState(null,'',location.pathname);boot();return}
const {data:ok,error:ce}=await sb.rpc('check_access_code',{code});
if(ce){console.error(ce);msg('Setup is not finished: the access code check is missing in Supabase. Run the setup SQL, then try again.','bad');return}
if(!ok){msg('That access code is not correct.','bad');return}
if(mode==='in'){const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;msg('Signing you in\u2026','ok')}
else{const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{access_code:code},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
if(data.session)msg('Account created. Signing you in\u2026','ok');
else if(data.user&&data.user.identities&&!data.user.identities.length)msg('This email already has an account. Choose Sign in.','bad');
else msg('Account created. Check your email and click the confirmation link, then sign in.','ok')}
}catch(e){msg(nice(e),'bad')}finally{b.disabled=false}}
async function signOut(){if(timer){clearTimeout(timer);timer=null;await push()}await sb.auth.signOut()}
render();anim();
if(sb){sb.auth.onAuthStateChange((ev,ses)=>{
if(ses&&ses.user){
if(recovering){if(ev!=='USER_UPDATED'){pend=ses.user;if(gm!=='newpw')showGate('newpw')}return}
if(!user||user.id!==ses.user.id){user=ses.user;setTimeout(boot,0)}
}else{user=null;
if(ev==='SIGNED_OUT'){clearTimeout(timer);timer=null;S=EMPTY();snap={};document.getElementById('out').style.display='none';setSt('');render();gm=null}
if(gm===null)showGate('in')}})}
else showGate('in','Could not load the sign-in service. Check your connection and refresh the page.','bad');
setTimeout(()=>{if(!user&&gm===null&&document.getElementById('gate').firstChild)showGate('in')},6000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script>
</body>
